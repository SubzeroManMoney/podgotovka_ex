<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Редактировать</title>
</head>
<body>
    <form method="post">
    {% csrf_token %}
            <input type="text" value="{{ client.secondname }}" name="secondname" required>
            <p></p>
            <input type="text" value="{{ client.firstname }}" name="firstname" required>
            <p></p>
            <input type="text" value="{{ client.phone }}" name="phone" required>
            <p></p>
            <input type="date" value="{{ client.bday|date:"Y-m-d" }}" name="bday" required>
            <p></p>
            <input type="text" value="{{ client.gender }}" name="gender" required>
            <p></p>
            <input type="text" value="{{ client.category }}" name="category" required>
            <p></p>
        <button type="submit">Подтвердить</button>
    </form>
</body>
</html>
